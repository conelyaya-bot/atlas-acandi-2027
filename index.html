<head>
<meta charset="UTF-8">

<title>Atlas Electoral Interactivo de Acandí 2022–2027</title>
<link rel="stylesheet" href="assets/leaflet/leaflet.css"/>

<style>
  :root{--azul:#1F4E78;--azul2:#2E75B6;--rojo:#C00000;--naranja:#C55A11;--gris:#6b7a90;--fondo:#eef2f7;--borde:#d5dee9}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:#222;overflow:hidden;height:100vh}
  #map{position:absolute;inset:0;z-index:1}
  .leaflet-container{background:#cfe0ea}
  .topbar{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(90deg,#173a5c,#1F4E78 60%,#2E75B6);color:#fff;
    display:flex;align-items:center;padding:0 16px;gap:14px;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .topbar h1{font-size:14.5px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .topbar .sub{font-size:10.5px;opacity:.85;margin-top:1px}
  .chips{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:4px 9px;text-align:center;min-width:68px}
  .chip b{display:block;font-size:12.5px}
  .chip span{font-size:8.5px;text-transform:uppercase;opacity:.85;letter-spacing:.5px}
  .chip.hot{background:rgba(255,170,0,.22);border-color:#ffc85a}
  #side{position:absolute;top:74px;left:12px;bottom:12px;width:330px;background:#fff;border-radius:12px;z-index:1000;
    box-shadow:0 4px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
  .side-head{padding:10px 12px 6px}
  #search{width:100%;padding:8px 10px;border:1px solid var(--borde);border-radius:8px;font-size:12.5px;outline:none}
  #search:focus{border-color:var(--azul2)}
  .side-tabs{display:flex;gap:4px;padding:8px 12px 0}
  .side-tab{flex:1;padding:6px 4px;font-size:11px;font-weight:600;border:none;background:#eef2f7;color:#4a5a6e;border-radius:7px 7px 0 0;cursor:pointer}
  .side-tab.act{background:var(--azul);color:#fff}
  #listWrap,#capasWrap{flex:1;overflow-y:auto;padding:0 10px 8px}
  #capasWrap{display:none;padding:10px 12px}
  .puesto-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;border:2px solid transparent;margin-bottom:4px;transition:all .15s}
  .puesto-item:hover{background:#f0f5fc}
  .puesto-item.sel{background:#e2ecf9;border-color:var(--azul2);box-shadow:0 1px 4px rgba(31,78,120,.2)}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #b9c4d0;flex:none}
  .puesto-item .nm{font-size:12.5px;font-weight:600;color:#22303f;line-height:1.15}
  .puesto-item .meta{font-size:10.5px;color:#7a8796;margin-top:1px}
  .puesto-item .val{margin-left:auto;text-align:right;flex:none}
  .puesto-item .val b{font-size:13px;color:var(--azul)}
  .puesto-item .val span{font-size:9px;color:#8a96a3}
  .puesto-item.acandi .nm{color:var(--azul)}
  .item-empty{text-align:center;color:#8a96a3;font-size:12px;padding:18px 6px}
  .cap-group{margin-top:8px}
  .cap-group h4{margin:6px 0 4px;font-size:11px;color:#5a6a7c;text-transform:uppercase;letter-spacing:.5px}
  .capa-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;border:2px solid transparent;margin-bottom:3px}
  .capa-item:hover{background:#f0f5fc}
  .capa-item.act{border-color:var(--azul2);background:#e2ecf9}
  .capa-swatch{width:18px;height:18px;border-radius:5px;border:2px solid #fff;box-shadow:0 0 0 1px #b9c4d0;flex:none}
  .capa-item .nm{font-size:12.5px;font-weight:600}
  .capa-item .desc{font-size:10.5px;color:#7a8796}
  .legend{margin-top:12px;padding:10px;background:#f6f9fc;border:1px solid var(--borde);border-radius:9px}
  .legend h4{margin:0 0 7px;font-size:11px;color:var(--azul)}
  .lg-row{display:flex;align-items:center;gap:7px;font-size:11px;color:#3a4756;padding:2px 0}
  .lg-swatch{width:13px;height:13px;border-radius:3px;flex:none}
  #detail{position:absolute;top:74px;right:12px;bottom:12px;width:400px;background:#fff;border-radius:12px;z-index:1000;
    box-shadow:0 4px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease}
  #detail.hidden{transform:translateX(calc(100% + 24px))}
  .det-head{padding:11px 16px 9px;color:#fff;position:relative}
  .det-head .t{font-size:15px;font-weight:700;line-height:1.2;padding-right:26px}
  .det-head .s{font-size:11px;opacity:.88;margin-top:2px}
  .det-close{position:absolute;top:9px;right:12px;background:rgba(255,255,255,.25);border:none;color:#fff;font-size:16px;width:26px;height:26px;border-radius:50%;cursor:pointer;line-height:1}
  .det-close:hover{background:rgba(255,255,255,.4)}
  .det-tabs{display:flex;gap:3px;padding:6px 10px;background:#f4f7fb;border-bottom:1px solid var(--borde)}
  .det-tab{flex:1;padding:5px 2px;font-size:10.5px;font-weight:600;border:none;background:transparent;color:#5a6a7c;border-radius:6px;cursor:pointer;white-space:nowrap}
  .det-tab:hover{background:#e6edf6}
  .det-tab.act{background:var(--azul);color:#fff}
  .det-body{flex:1;overflow-y:auto;padding:10px 14px 16px}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .kpi{background:#f4f8fc;border:1px solid var(--borde);border-radius:9px;padding:7px 9px}
  .kpi b{font-size:16px;color:var(--azul);display:block}
  .kpi span{font-size:9px;color:#6d7b8a;text-transform:uppercase;letter-spacing:.4px}
  .kpi.neg b{color:var(--rojo)}
  .kpi.pos b{color:#1e7d4f}
  h3.sec{margin:14px 0 7px;font-size:11.5px;color:var(--azul);text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--azul);padding-bottom:4px}
  .cand-row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .cand-row .lbl{width:104px;font-size:10.5px;color:#3a4756;line-height:1.2}
  .cand-row .track{flex:1;background:#eef2f7;border-radius:5px;height:17px;overflow:hidden}
  .cand-row .fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;min-width:24px}
  .cand-row .fill b{color:#fff;font-size:10.5px}
  .bar-leg{font-size:10px;color:#8a96a3;margin-top:3px}
  table.cuadro{width:100%;border-collapse:collapse;margin-top:6px;font-size:11.5px}
  table.cuadro th,table.cuadro td{border:1px solid var(--borde);padding:5px 7px}
  table.cuadro th{background:#eef2f7;color:#3a4756;font-weight:600;text-align:left}
  table.cuadro td.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  table.cuadro tr.hl td{background:#e2ecf9}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;color:#fff;vertical-align:middle}
  .tag.gan{background:#1e7d4f}.tag.emp{background:#808080}
  .note{font-size:10px;color:#8a96a3;margin-top:8px;line-height:1.45}
  .btn{width:100%;padding:9px;border:none;border-radius:9px;background:var(--azul);color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
  .btn:hover{background:#173a5c}
  .btn.sec{background:#eef2f7;color:var(--azul);border:1px solid var(--borde)}
  .meta-bar{height:10px;background:#eef2f7;border-radius:6px;overflow:hidden;margin-top:2px}
  .meta-bar>div{height:100%;border-radius:6px;transition:width .3s}
  input.simp{width:78px;padding:5px 6px;border:1px solid var(--borde);border-radius:6px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
  input.simp:focus{border-color:var(--azul2);outline:none}
  table.metaT{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
  table.metaT th,table.metaT td{border:1px solid var(--borde);padding:5px 6px}
  table.metaT th{background:#eef2f7;font-weight:600;color:#3a4756}
  table.metaT td.r{text-align:right;font-variant-numeric:tabular-nums}
  table.metaT input{width:70px}

  .metaRowTtl{background:#f4f8fc;font-weight:700}

  .chart-box{position:relative;height:210px}

  .toast.show{opacity:1}
  .sel-pulse{animation:ringpulse 1.6s ease-out infinite}
  @keyframes ringpulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
  .map-legend{position:absolute;left:354px;bottom:12px;background:rgba(255,255,255,.95);border-radius:9px;padding:9px 11px;

  .map-legend h4{margin:0 0 5px;font-size:10.5px;color:var(--azul);text-transform:uppercase;letter-spacing:.5px}

    #menuBtn{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
      color:#fff;font-size:20px;width:38px;height:38px;border-radius:10px;cursor:pointer;flex:none}
    #fab{display:flex;align-items:center;justify-content:center;position:fixed;left:14px;bottom:18px;z-index:1101;width:54px;height:54px;
      border-radius:50%;background:var(--azul);color:#fff;font-size:22px;border:none;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer}
    #fab:active{transform:scale(.95)}
    #side{position:fixed;left:0;right:0;top:auto;bottom:0;width:100%;max-height:48vh;border-radius:16px 16px 0 0;
      transform:translateY(105%);transition:transform .3s ease;z-index:1200}
    #side.open{transform:translateY(0)}
    #detail{position:fixed;inset:0;width:100%;height:100%;border-radius:0;transform:none;z-index:1150}
    #detail.hidden{transform:translateY(102%)}
    .det-tabs{flex-wrap:nowrap;overflow-x:auto}
    .det-tab{white-space:nowrap;flex:none;padding:7px 10px}
    #mapLegend{display:none}
    .leaflet-top.leaflet-left{top:56px}
    .leaflet-control-zoom{position:absolute;top:auto;bottom:8px;right:8px;left:auto}
    table.metaT,table.cuadro{display:block;overflow-x:auto;white-space:nowrap}
    .det-body{-webkit-overflow-scrolling:touch}
    .toast{left:12px;right:12px;transform:none;text-align:center}
    .sel-pulse{animation:none}
  }
</style>
</head>

/* ================= utilidades ================= */
const fmt = n => n==null?'—':n.toLocaleString('es-CO');
const f1  = n => n==null?'—':n.toLocaleString('es-CO',{maximumFractionDigits:1});
const f2  = n => n==null?'—':n.toLocaleString('es-CO',{maximumFractionDigits:2});
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pct = (num,den) => den? f1(num/den*100)+'%' : '—';
const jsel = s => esc(s).replace(/'/g,"\\'");

const TOT = {
  censo_2026: PUESTOS.reduce((s,p)=>s+p.censo_2026,0),
  censo_2022: PUESTOS.reduce((s,p)=>s+p.censo_2022,0),
  dep: PUESTOS.reduce((s,p)=>s+p.depositados_2023,0),
  cand: PUESTOS.reduce((s,p)=>s+p.votos_cand,0),
  mart: PUESTOS.reduce((s,p)=>s+p.martinez_2023,0),
  bello: PUESTOS.reduce((s,p)=>s+p.bello_2023,0),
  arbel: PUESTOS.reduce((s,p)=>s+p.arbelaez_2023,0),
};

/* ================= capas temáticas ================= */
const CAPAS = {
  potencial:{name:'Potencial electoral 2026',desc:'Círculos proporcionales al censo 2026',
    get:p=>p.censo_2026,
    bins:[[4000,Infinity,'#1F4E78','Censo ≥ 4.000'],[1500,4000,'#2E75B6','1.500 – 4.000'],
          [500,1500,'#A9D18E','500 – 1.500'],[250,500,'#FFE699','250 – 500'],[0,250,'#F4B183','< 250']],sw:'#1F4E78'},
  crecimiento:{name:'Crecimiento 2022→2026',desc:'Graduado divergente por % de variación',
    get:p=>p.crecimiento_pct_22_26,
    bins:[[5,Infinity,'#1e7d4f','> +5%'],[0,5,'#A9D18E','0 a +5%'],[-5,0,'#FFE699','-5 a 0%'],[-Infinity,-5,'#C00000','< -5%']],sw:'#1e7d4f'},
  alcaldia:{name:'Resultado Alcaldía 2023',desc:'Color por candidato ganador (o empate)',
    get:p=>p.ganador_2023,

  cobertura:{name:'Cobertura 2023',desc:'Depositados 2023 como % del censo 2026',

    bins:[[60,Infinity,'#1e7d4f','≥ 60%'],[40,60,'#A9D18E','40 – 60%'],[20,40,'#FFE699','20 – 40%'],[0,20,'#C00000','< 20%']],sw:'#1e7d4f'},
};
const CAPA_KEYS = Object.keys(CAPAS);

function colorFor(k,p){
  const c=CAPAS[k], v=c.get(p);
  if(k==='alcaldia'){ for(const b of c.bins) if(b[0].test(v)) return b[1]; }
  else if(k==='compet'){ for(const b of c.bins) if(v===b[0]) return b[1]; }
  else { for(const b of c.bins) if(v>=b[0] && v<b[1]) return b[1]; }
  return c.bins[c.bins.length-1][1];
}

/* ================= mapa y bases ================= */
const OSM = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
const GOG  = L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=es&x={x}&y={y}&z={z}',{maxZoom:22,attribution:'Imagery &copy; Google'});
const GOGH = L.tileLayer('https://mt1.google.com/vt/lyrs=y&hl=es&x={x}&y={y}&z={z}',{maxZoom:22,attribution:'Imagery &copy; Google'});
let base='satelite';
const map = L.map('map',{zoomControl:true,minZoom:9,maxZoom:21,zoomSnap:1}).setView([8.52,-77.26],11);
GOG.addTo(map);
map.on('zoomend',applySelection);
L.geoJSON(LIMITE,{style:{color:'#d00000',weight:2.5,fill:false,dashArray:'7,5'}})
 .bindPopup('<b>Límite municipal de Acandí</b> (GAUL)').addTo(map);

function setBase(k){
  base=k;
  [OSM,GOG,GOGH].forEach(l=>{ try{ if(map.hasLayer(l)) map.removeLayer(l); }catch(e){} });
  const target = k==='satelite' ? GOG : k==='hibrido' ? GOGH : OSM;
  if(!map.hasLayer(target)) target.addTo(map);
  renderCapasUI();
}

/* ================= marcadores ================= */
const markerLayer = L.layerGroup().addTo(map);
let activeCapa='potencial';
let selected=null; // null = municipio
const markersData={};
const simps = loadSimp();

function markerRadius(){ const z=map.getZoom(); return z>=18?6:(z>=15?9:13); }
function gmapsLink(p){ return `https://www.google.com/maps/@${p.lat},${p.lon},18z`; }

function buildMarkers(){
  markerLayer.clearLayers();
  PUESTOS.forEach(p=>{
    const col=colorFor(activeCapa,p);
    const m=L.circleMarker([p.lat,p.lon],{radius:markerRadius(),color:'#fff',weight:2,fillColor:col,fillOpacity:.92,opacity:.95,className:'puesto-marker'})
      .addTo(markerLayer);
    m.bindTooltip(`<b>${esc(p.short)}</b><br>Censo 2026: ${fmt(p.censo_2026)}<br><span style="font-size:10px">🔍 haz zoom para ver el sitio real</span>`,{direction:'top',offset:[0,-12],opacity:.92});
    m.on('click',()=>{ selectPuesto(p.puesto); });
    markersData[p.puesto]=m;
  });
  applySelection();
}

function applySelection(){
  PUESTOS.forEach(p=>{
    const m=markersData[p.puesto]; if(!m) return;
    const isSel=selected===p.puesto;
    const col=colorFor(activeCapa,p);
    const r=markerRadius();
    m.setStyle({radius:isSel?r+5:r,weight:isSel?4:2,fillColor:col,
      fillOpacity:isSel?1:(selected?.3:.92),opacity:isSel?1:(selected?.55:.95),
      className:isSel?'puesto-marker sel-pulse':'puesto-marker'});
  });
  renderMapLegend();
}

function renderMapLegend(){
  const c=CAPAS[activeCapa];
  document.getElementById('mlTitle').textContent='Leyenda · '+c.name;
  document.getElementById('mlRows').innerHTML=c.bins.map(b=>`<div class="lg-row"><span class="lg-swatch" style="background:${b[1]}"></span>${b[2]}</div>`).join('');
}

/* ================= selección ================= */
function isMobile(){ return window.matchMedia('(max-width:767px)').matches; }
function openSide(){ document.getElementById('side').classList.add('open'); }
function closeSide(){ document.getElementById('side').classList.remove('open'); }
function toggleSide(){ document.getElementById('side').classList.toggle('open'); }

function selectPuesto(nombre){
  try{ map.closePopup(); }catch(e){}
  Object.values(markersData).forEach(m=>{ try{ m.closeTooltip(); }catch(e){} });
  if(isMobile()) closeSide();
  selected=nombre;
  applySelection();
  renderListUI(document.getElementById('search').value);
  renderDetail();
  if(nombre){
    const p=PUESTOS.find(x=>x.puesto===nombre);
    if(p) map.flyTo([p.lat,p.lon],Math.max(map.getZoom(),17),{duration:.8});
  } else {
    map.flyToBounds(L.geoJSON(LIMITE).getBounds(),{duration:.8,padding:[30,30]});
  }
  showToast(nombre?('📍 '+nombre):'📍 Acandí (municipio)');
}

/* ================= panel izquierdo ================= */
function renderListUI(filter){
  filter=(filter||'').toLowerCase().trim();
  const wrap=document.getElementById('listWrap');
  let h='';
  const acandiSel=selected===null;
  h += `<div class="puesto-item acandi ${acandiSel?'sel':''}" onclick="selectPuesto(null)">
    <div class="dot" style="background:${acandiSel?'#173a5c':'#173a5c'}"></div>
    <div style="flex:1"><div class="nm">🏛️ ACANDÍ (MUNICIPIO)</div>
    <div class="meta">Total 10 puestos · ${fmt(TOT.censo_2026)} electores · ${fmt(TOT.dep)} depos. 2023</div></div>
    <div class="val"><b>4.200</b><span>meta</span></div>
  </div>`;
  const list=PUESTOS.filter(p=>!filter||p.puesto.toLowerCase().includes(filter)||p.short.toLowerCase().includes(filter));
  if(!list.length) h+='<div class="item-empty">Sin resultados</div>';

  h += `<div class="capa-item ${base==='satelite'?'act':''}" onclick="setBase('satelite')">

  h += `</div><div class="cap-group"><h4>Capa temática</h4>`;
  CAPA_KEYS.forEach(k=>{

    h += `<div class="capa-item ${activeCapa===k?'act':''}" onclick="setCapa('${k}')">

  wrap.innerHTML=h;
}

function setCapa(k){

/* ================= SIMPATIZANTES (localStorage) ================= */
const SIMP_KEY='acandi_simpatizantes_v1';
const METAREF_KEY='acandi_metaref_v1';
function loadSimp(){ try{ return JSON.parse(localStorage.getItem(SIMP_KEY))||{}; }catch(e){ return {}; } }
function saveSimp(){ try{ localStorage.setItem(SIMP_KEY,JSON.stringify(simps)); }catch(e){} }
function getMetaref(){ const v=parseInt(localStorage.getItem(METAREF_KEY)||'4200',10); return [3900,4200,4500].includes(v)?v:4200; }
function setMetaref(v){ localStorage.setItem(METAREF_KEY,String(v)); }
function simpOf(n){ return Math.max(0,parseInt(simps[n]||0,10)||0); }
function estadoDe(a){ if(a>=100)return['✔ Meta','ok']; if(a>=50)return['Avanzando','av']; if(a>=25)return['Iniciado','in']; return['En riesgo','ri']; }
function barColorPct(a){ if(a>=100)return'#1e7d4f'; if(a>=50)return'#2E75B6'; if(a>=25)return'#F4B183'; return'#C00000'; }
function TOT_meta(v){ return PUESTOS.reduce((a,p)=>a+(p['meta_'+v]||0),0); }
function barPctHTML(a){
  return `<div class="meta-bar"><div style="width:${Math.min(100,a)}%;background:${barColorPct(a)}"></div></div>
          <div style="font-size:9px;color:#5a6a7c;margin-top:1px">${f1(a)}%</div>`;
}

function metaTableHTML(){
  const ref=getMetaref();
  const rows=PUESTOS.map((p,i)=>{
    const meta=p['meta_'+ref], s=simpOf(p.puesto), pA=meta? s/meta*100:0;
    const [et,cls]=estadoDe(pA);
    return `<tr id="mtRow${i}">
      <td style="cursor:pointer;font-weight:600;color:var(--azul)" onclick="selectPuesto('${jsel(p.puesto)}')">${esc(p.short)}</td>
      <td class="r">${fmt(p.meta_3900)}</td><td class="r">${fmt(p.meta_4200)}</td><td class="r">${fmt(p.meta_4500)}</td>
      <td><input class="simp" type="number" min="0" value="${s}" data-i="${i}" onchange="onSimpChange(this)"></td>
      <td class="mini-w mtProg">${barPctHTML(pA)}</td>
      <td class="mtEst"><span class="est ${cls}">${et}</span></td>
    </tr>`;
  }).join('');
  const totS=PUESTOS.reduce((a,p)=>a+simpOf(p.puesto),0), totM=TOT_meta(ref), totPA=totM? totS/totM*100:0;
  const [et,cls]=estadoDe(totPA);
  return `
  <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
    <span style="font-size:12px;color:#3a4756">Comparar con meta:</span>
    <select id="metaRefSel" onchange="onMetaRef(this)" style="padding:5px;border:1px solid var(--borde);border-radius:6px">
      ${[3900,4200,4500].map(v=>`<option value="${v}" ${v===ref?'selected':''}>${fmt(v)} votos</option>`).join('')}
    </select>
  </div>
  <table class="metaT">
    <thead><tr><th>Puesto</th><th>M3900</th><th>M4200</th><th>M4500</th><th>Simpatizantes</th><th>Avance</th><th>Estado</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr class="metaRowTtl" id="mtTot">
      <td>ACANDÍ (total)</td><td class="r">${fmt(TOT_meta(3900))}</td><td class="r">${fmt(TOT_meta(4200))}</td><td class="r">${fmt(TOT_meta(4500))}</td>
      <td class="r mtSimp">${fmt(totS)}</td>
      <td class="mini-w mtProg">${barPctHTML(totPA)}</td>
      <td class="mtEst"><span class="est ${cls}">${et}</span></td>
    </tr></tfoot>
  </table>
  <button class="btn sec" onclick="resetSimp()">♻️ Reiniciar registro de simpatizantes</button>
  <div class="note">Edita la columna <b>Simpatizantes</b>: registra los apoyos que se van sumando por puesto y compáralos con la meta elegida. Se guarda automáticamente en este navegador (localStorage).</div>`;
}

function onSimpChange(input){
  const i=parseInt(input.dataset.i,10);
  simps[PUESTOS[i].puesto]=Math.max(0,parseInt(input.value||'0',10)||0);
  saveSimp();
  refreshMetaUI(); // actualiza en sitio, sin quitar el foco
}
function onMetaRef(sel){ setMetaref(parseInt(sel.value,10)); renderDetail(); }
function resetSimp(){ if(confirm('¿Borrar todos los simpatizantes registrados?')){ Object.keys(simps).forEach(k=>delete simps[k]); saveSimp(); renderDetail(); showToast('♻️ Registro reiniciado'); } }

function refreshMetaUI(){
  const body=document.getElementById('detBody');
  if(selected===null){
    const ref=getMetaref();
    PUESTOS.forEach((p,i)=>{
      const meta=p['meta_'+ref], s=simpOf(p.puesto), pA=meta? s/meta*100:0;
      const [et,cls]=estadoDe(pA);
      const prog=body.querySelector('#mtRow'+i+' .mtProg'); if(prog) prog.innerHTML=barPctHTML(pA);
      const est=body.querySelector('#mtRow'+i+' .mtEst'); if(est) est.innerHTML='<span class="est '+cls+'">'+et+'</span>';
    });
    const totS=PUESTOS.reduce((a,p)=>a+simpOf(p.puesto),0), totM=TOT_meta(ref), totPA=totM? totS/totM*100:0;
    const [et,cls]=estadoDe(totPA);
    const ts=body.querySelector('#mtTot .mtSimp'); if(ts) ts.innerHTML=fmt(totS);
    const tp=body.querySelector('#mtTot .mtProg'); if(tp) tp.innerHTML=barPctHTML(totPA);
    const te=body.querySelector('#mtTot .mtEst'); if(te) te.innerHTML='<span class="est '+cls+'">'+et+'</span>';
  } else {
    const p=PUESTOS.find(x=>x.puesto===selected); if(!p) return;
    const ref=getMetaref(), meta=p['meta_'+ref], s=simpOf(p.puesto), pA=meta? s/meta*100:0;
    const [et,cls]=estadoDe(pA);
    const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
    set('kpiSimp',fmt(s)); set('kpiAvance',f1(pA)+'%'); set('kpiFalta',fmt(Math.max(0,meta-s)));
    const bar=document.getElementById('barPuesto'); if(bar){ bar.style.width=Math.min(100,pA)+'%'; bar.style.background=barColorPct(pA); }
    const est=document.getElementById('estPuesto'); if(est){ est.textContent=et; est.className='est '+cls; }
  }
}

/* ================= detalle (panel derecho tabulado) ================= */
let detailTab='gral';
const charts={};
function destroyCharts(){ Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); for(const k in charts) delete charts[k]; }

function renderDetail(){
  const det=document.getElementById('detail'), head=document.getElementById('detHead');
  const titulo=document.getElementById('detTitulo'), sub=document.getElementById('detSub'), body=document.getElementById('detBody');
  const p=selected?PUESTOS.find(x=>x.puesto===selected):null;
  const isMun=selected===null;
  let grad;
  if(p){
    const gan=p.ganador_2023.includes('EMPATE')?'#808080':(p.ganador_2023.includes('MARTINEZ')?'#1F4E78':'#C55A11');
    grad=`linear-gradient(90deg, ${gan}, #3a4756)`;
    titulo.textContent=p.nombre;
    sub.innerHTML=`Lat ${p.lat.toFixed(5)} · Lon ${p.lon.toFixed(5)} · Censo 2026: <b>${fmt(p.censo_2026)}</b>`;
  } else {
    grad='linear-gradient(90deg,#173a5c,#2E75B6)';
    titulo.textContent='🏛️ Acandí (Municipio)';
    sub.innerHTML=`10 puestos de votación · censo 2026 <b>${fmt(TOT.censo_2026)}</b> (36 mesas) · depositados 2023 <b>${fmt(TOT.dep)}</b>`;
  }
  head.style.background=grad;
  document.querySelectorAll('.det-tab').forEach(b=>b.classList.toggle('act',b.dataset.t===detailTab));
  body.innerHTML=contentFor(detailTab,p,isMun);
  if(detailTab==='graf') setTimeout(()=>buildGraficas(p,isMun),60);
  det.classList.remove('hidden');
}

function contentFor(tab,p,isMun){
  switch(tab){
    case 'gral':     return gralHTML(p,isMun);
    case 'censo':    return censoHTML(p,isMun);
    case 'alcaldia': return alcaldiaHTML(p,isMun);
    case 'meta':     return metaHTML(p,isMun);
    case 'graf':     return '<div class="chart-card"><h5>Cargando gráficas…</h5><div class="chart-box"></div></div>';
  }
}
function candBar(lbl,col,v,total){
  const w=total? Math.max(6,Math.round(v/total*100)):0;
  return `<div class="cand-row"><div class="lbl">${lbl}</div>
    <div class="track"><div class="fill" style="width:${w}%;background:${col}"><b>${fmt(v)}</b></div></div>
    <div style="width:44px;text-align:right;font-size:11px;color:#5a6a7c">${pct(v,total)}</div></div>`;
}

    <div class="note">Votos de la elección de Alcaldía 2023 (Registraduría). Índice de competitividad = margen ÷ votos a candidatos.</div>`;
}

/* ---- Meta ---- */
function metaHTML(p,isMun){
  if(isMun) return `<h3 class="sec">Tabla dinámica de metas por puesto</h3>${metaTableHTML()}`;
  const ref=getMetaref(), meta=p['meta_'+ref], s=simpOf(p.puesto), pA=meta? s/meta*100:0;
  const [et,cls]=estadoDe(pA), falt=Math.max(0,meta-s);
  return `
    <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
      <span style="font-size:12px;color:#3a4756">Comparar con meta:</span>
      <select onchange="onMetaRef(this)" style="padding:5px;border:1px solid var(--borde);border-radius:6px">
        ${[3900,4200,4500].map(v=>`<option value="${v}" ${v===ref?'selected':''}>${fmt(v)} votos</option>`).join('')}
      </select>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><b>${fmt(meta)}</b><span>Meta ${fmt(ref)} para ${esc(p.short)}</span></div>
      <div class="kpi"><b id="kpiSimp">${fmt(s)}</b><span>Simpatizantes captados</span></div>
      <div class="kpi ${pA>=100?'pos':'neg'}"><b id="kpiAvance">${f1(pA)}%</b><span>Avance vs meta ${fmt(ref)}</span></div>
      <div class="kpi"><b id="kpiFalta">${fmt(falt)}</b><span>Faltan para la meta</span></div>
    </div>
    <div class="meta-bar" style="height:14px"><div id="barPuesto" style="width:${Math.min(100,pA)}%;background:${barColorPct(pA)}"></div></div>
    <div style="font-size:11px;color:#5a6a7c;margin:3px 0 6px">Avance: <b>${f1(pA)}%</b> · Estado: <span class="est ${cls}" id="estPuesto">${et}</span></div>
    <label style="font-size:12px;color:#3a4756;display:block;margin-top:4px">Simpatizantes captados en ${esc(p.short)}:</label>
    <input class="simp" type="number" min="0" value="${s}" data-i="${PUESTOS.findIndex(x=>x.puesto===p.puesto)}"
      onchange="onSimpChange(this)" style="width:100%;margin-top:4px;text-align:center;font-size:16px;padding:9px">
    <table class="cuadro" style="margin-top:12px">
      <tr><td>Meta mínima (3900)</td><td class="r">${fmt(p.meta_3900)}</td></tr>
      <tr class="hl"><td>Meta objetivo (4200)</td><td class="r">${fmt(p.meta_4200)}</td></tr>
      <tr><td>Meta colchón (4500)</td><td class="r">${fmt(p.meta_4500)}</td></tr>
      <tr><td>Meta 4200 como % del censo 2026</td><td class="r">${f1(p.meta_4200_pct_censo26)}%</td></tr>
    </table>
    <div class="note">Registra aquí los simpatizantes/compromisos que se van sumando en este puesto. Se guarda automáticamente en este navegador.</div>`;
}

/* ---- Gráficas (Chart.js) ---- */
function buildGraficas(p,isMun){
  destroyCharts();
  const body=document.getElementById('detBody');
  let h='';
  if(isMun){
    h += `<div class="chart-card"><h5>Censo electoral 2022 vs 2026 por puesto</h5><div class="chart-box"><canvas id="chCenso"></canvas></div></div>`;
    h += `<div class="chart-card"><h5>Crecimiento del censo 2022→2026 (%)</h5><div class="chart-box"><canvas id="chCre"></canvas></div></div>`;
    h += `<div class="chart-card"><h5>Votos Alcaldía 2023 (municipal)</h5><div class="chart-box"><canvas id="chAlc"></canvas></div></div>`;
    h += `<div class="chart-card"><h5>Avance simpatizantes vs meta ${fmt(getMetaref())} (municipal)</h5><div class="chart-box"><canvas id="chMeta"></canvas></div></div>`;
    body.innerHTML=h;
    const labs=PUESTOS.map(x=>x.short), c22=PUESTOS.map(x=>x.censo_2022), c26=PUESTOS.map(x=>x.censo_2026), cre=PUESTOS.map(x=>x.crecimiento_pct_22_26);
    mk('chCenso',{type:'bar',data:{labels:labs,datasets:[
      {label:'Censo 2022',data:c22,backgroundColor:'#9aa7b5'},
      {label:'Censo 2026',data:c26,backgroundColor:'#1F4E78'}]},options:chartOpts(true)});
    mk('chCre',{type:'bar',data:{labels:labs,datasets:[{label:'% variación',data:cre,backgroundColor:cre.map(v=>v>=0?'#1e7d4f':'#C00000')}]},options:chartOpts(true)});
    mk('chAlc',{type:'doughnut',data:{labels:['Martínez','Bello','Arbeláez'],datasets:[{data:[TOT.mart,TOT.bello,TOT.arbel],backgroundColor:['#1F4E78','#C55A11','#7f8c99']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.label+': '+c.parsed.toLocaleString('es-CO')}}}}});
    const totS=PUESTOS.reduce((a,x)=>a+simpOf(x.puesto),0), totM=TOT_meta(getMetaref());
    mk('chMeta',{type:'doughnut',data:{labels:['Simpatizantes captados','Faltan para la meta'],datasets:[{data:[totS,Math.max(0,totM-totS)],backgroundColor:['#1e7d4f','#e0e6ee']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
  } else {
    h += `<div class="chart-card"><h5>Votos Alcaldía 2023 · ${esc(p.short)}</h5><div class="chart-box"><canvas id="chAlc"></canvas></div></div>`;
    h += `<div class="chart-card"><h5>Censo 2022 vs 2026</h5><div class="chart-box"><canvas id="chCenso"></canvas></div></div>`;
    h += `<div class="chart-card"><h5>Avance simpatizantes vs meta ${fmt(getMetaref())}</h5><div class="chart-box"><canvas id="chMeta"></canvas></div></div>`;
    body.innerHTML=h;
    mk('chAlc',{type:'doughnut',data:{labels:['Martínez','Bello','Arbeláez'],datasets:[{data:[p.martinez_2023,p.bello_2023,p.arbelaez_2023],backgroundColor:['#1F4E78','#C55A11','#7f8c99']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
    mk('chCenso',{type:'bar',data:{labels:['2022','2026'],datasets:[{label:'Censo',data:[p.censo_2022,p.censo_2026],backgroundColor:['#9aa7b5','#1F4E78']}]},options:chartOpts(true)});
    const m=p['meta_'+getMetaref()], s=simpOf(p.puesto);
    mk('chMeta',{type:'doughnut',data:{labels:['Captados','Faltan'],datasets:[{data:[s,Math.max(0,m-s)],backgroundColor:['#1e7d4f','#e0e6ee']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
  }
}
function chartOpts(withY){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},
    scales:withY?{y:{ticks:{font:{size:10}}},x:{ticks:{font:{size:9,autoSkip:false,maxRotation:40,minRotation:30}}}}:{}};
}
function mk(id,cfg){
  const el=document.getElementById(id); if(!el) return;
  try{ charts[id]=new Chart(el.getContext('2d'),cfg); }catch(e){ console.error(e); }
}

/* ================= misc ================= */
let toastTimer;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }
function renderChips(){
  document.getElementById('chips').innerHTML=`
    <div class="chip"><b>${fmt(TOT.censo_2026)}</b><span>Censo 2026</span></div>
    <div class="chip"><b>${fmt(TOT.dep)}</b><span>Depos. 2023</span></div>
    <div class="chip hot"><b>4.200</b><span>Meta 2027</span></div>
    <div class="chip"><b>${pct(TOT.dep,TOT.censo_2026)}</b><span>Part. 2023</span></div>`;
}

/* ================= init ================= */
document.getElementById('search').addEventListener('input',e=>renderListUI(e.target.value));
document.querySelectorAll('.side-tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.side-tab').forEach(x=>x.classList.remove('act'));
  b.classList.add('act');
  const isList=b.dataset.tab==='list';
  document.getElementById('listWrap').style.display=isList?'block':'none';
  document.getElementById('capasWrap').style.display=isList?'none':'block';
}));
document.querySelectorAll('.det-tab').forEach(b=>b.addEventListener('click',()=>{
  detailTab=b.dataset.t;
  document.querySelectorAll('.det-tab').forEach(x=>x.classList.toggle('act',x===b));
  if(detailTab!=='graf') destroyCharts();
  const p=selected?PUESTOS.find(x=>x.puesto===selected):null;
  document.getElementById('detBody').innerHTML=contentFor(detailTab,p,selected===null);
  if(detailTab==='graf') setTimeout(()=>buildGraficas(p,selected===null),60);
}));
document.getElementById('detClose').addEventListener('click',()=>{
  selected=null; applySelection(); renderListUI(document.getElementById('search').value);
  if(isMobile()){ document.getElementById('detail').classList.add('hidden'); }
  else { renderDetail(); }
});
document.getElementById('menuBtn').addEventListener('click',toggleSide);
document.getElementById('fab').addEventListener('click',()=>{ toggleSide(); document.getElementById('detail').classList.add('hidden'); });
document.getElementById('search').addEventListener('focus',()=>{ if(isMobile()) openSide(); });

buildMarkers();
renderListUI('');
renderCapasUI();
renderChips();
renderDetail();
if(isMobile()){ document.getElementById('detail').classList.add('hidden'); }
</script>
</body>
</html>
